{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ReclutaMente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen px-4">

    <div class="max-w-md w-full bg-zinc-900 border border-white/10 rounded-2xl p-8 shadow-xl">
        <div class="text-center mb-6">
            <span class="text-3xl">🧠</span>
            <h1 class="text-xl font-bold text-white mt-2">Iniciar Sesión en ReclutaMente</h1>
            <p class="text-sm text-zinc-400">Ingresa a tu plataforma de reclutamiento</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 text-sm bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Nombre de usuario</label>
                <input type="text" name="username" required placeholder="Escribe tu usuario" class="w-full bg-zinc-950 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-zinc-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-zinc-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-sm shadow-sm">
                Entrar a la plataforma
            </button>
        </form>

        <p class="text-center text-sm text-zinc-400 mt-6">
            ¿No tienes una cuenta? 
            <a href="{% url 'registro' %}" class="text-indigo-400 font-semibold hover:underline">Regístrate aquí</a>
        </p>
    </div>

</body>
</html>
