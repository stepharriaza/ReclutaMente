{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada | ReclutaMente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-zinc-950 text-white antialiased">
    <div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">
        <div aria-hidden="true" class="pointer-events-none absolute inset-0">
            <div class="absolute -left-40 top-0 h-[30rem] w-[30rem] rounded-full bg-fuchsia-500/25 blur-3xl"></div>
            <div class="absolute -right-32 bottom-0 h-96 w-96 rounded-full bg-indigo-400/25 blur-3xl"></div>
        </div>

        <div class="relative w-full max-w-md rounded-xl border border-white/10 bg-zinc-900/60 p-8 text-center shadow-2xl backdrop-blur-xl">
            <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-emerald-500/15 text-3xl">✓</div>
            <h1 class="text-2xl font-extrabold tracking-tight">Contraseña actualizada</h1>
            <p class="mt-4 text-sm leading-relaxed text-indigo-200/70">
                Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con tus nuevas credenciales.
            </p>
            <a href="{% url 'login' %}" class="mt-8 inline-block rounded-lg bg-indigo-600 px-6 py-3 text-xs font-bold uppercase tracking-widest text-white transition hover:bg-indigo-500">
                Iniciar sesión
            </a>
        </div>
    </div>
</body>
</html>
