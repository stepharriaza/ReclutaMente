{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ReclutaMente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen py-10 px-4">

    <div class="max-w-md w-full bg-zinc-900 border border-white/10 rounded-2xl p-8 shadow-xl">
        <div class="text-center mb-6">
            <span class="text-3xl">🧠</span>
            <h1 class="text-xl font-bold text-white mt-2">Crea tu cuenta</h1>
            <p class="text-sm text-zinc-400">Únete a ReclutaMente</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 text-sm bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" onsubmit="return validarPasswords()" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Nombre</label>
                <input type="text" name="nombre" required placeholder="Escribe tu nombre completo" class="w-full bg-zinc-950 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Usuario</label>
                <input type="text" name="username" required placeholder="Escribe un nombre de usuario" class="w-full bg-zinc-950 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Correo electrónico</label>
                <input type="email" name="email" required placeholder="Ingresa tu correo electrónico"class="w-full bg-zinc-950 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="Escribe una contraseña" class="w-full bg-zinc-950 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Confirmar contraseña</label>
                <input type="password" name="confirm_password" required placeholder="Escribe de nuevo la contraseña" class="w-full bg-zinc-950 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-sm shadow-sm mt-4">
                Registrarse
            </button>
        </form>

        <script>
            function validarPasswords() {
            const password = document.querySelector('[name="password"]').value;
            const confirmPassword = document.querySelector('[name="confirm_password"]').value;

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden');
                return false;
            }

                return true;
            }
        </script>

        <p class="text-center text-sm text-zinc-400 mt-6">
            ¿Ya tienes una cuenta? 
            <a href="{% url 'login' %}" class="text-indigo-400 font-semibold hover:underline">Inicia sesión</a>
        </p>
    </div>

</body>
</html>
