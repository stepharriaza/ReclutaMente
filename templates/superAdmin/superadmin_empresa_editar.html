{% extends 'base.html' %}

{% block title %}Editar Empresa - Superadmin{% endblock %}

{% block content %}

<!-- FORMULARIO DE EDICIÓN -->
<form method="POST" action="">
    {% csrf_token %}
    
    <!-- Nombre de la Empresa -->
    <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre de la empresa</label>
        <input type="text" name="nombre" value="{{ empresa.nombre }}" required placeholder="Ej. Innovaciones S.A." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>

    <!-- Plan Contratado -->
    <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Plan contratado</label>
        <select name="plan" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            <option value="" disabled>Seleccione un plan...</option>
            <option value="Básico" {% if empresa.plan == "Básico" %}selected{% endif %}>Básico</option>
            <option value="Profesional" {% if empresa.plan == "Profesional" %}selected{% endif %}>Profesional</option>
            <option value="Corporativo" {% if empresa.plan == "Corporativo" %}selected{% endif %}>Corporativo</option>
        </select>
    </div>

    <!-- Teléfono -->
    <div class="mb-6">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Teléfono</label>
        <input type="tel" name="telefono" value="{{ empresa.telefono }}" required placeholder="Ej. 24567890" pattern="[0-9\s\-]{8,}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <p class="text-[10px] text-gray-400 mt-1">Mínimo 8 dígitos numéricos.</p>
    </div>
    <!-- Dentro de tu formulario de edición -->
    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Estado de la Empresa</label>
        <select name="estado" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            <option value="Activo" {% if empresa.estado == 'Activo' %}selected{% endif %}>Activo</option>
            <option value="Inactivo" {% if empresa.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
        </select>
    </div>

    <!-- INFORMACIÓN DE VÍNCULO (Solo lectura) -->
    <div class="mb-6 p-4 bg-gray-50 border border-gray-200 rounded-lg">
        <p class="text-xs font-bold text-gray-700 uppercase mb-1">Usuario Administrador Vinculado</p>
        <p class="text-sm text-gray-600"><span class="font-medium">Usuario:</span> {{ empresa.usuario.nombre_usuario }}</p>
        <p class="text-sm text-gray-600"><span class="font-medium">Correo:</span> {{ empresa.usuario.email }}</p>
    </div>

    <!-- BOTONES DE ACCIÓN -->
    <div class="flex justify-end gap-3">
        <a href="{% url 'superadmin_empresas' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition">
            Cancelar
        </a>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
            Guardar Cambios
        </button>
    </div>
</form>
{% endblock %}
